name: Tests

on:
  pull_request:
  push:
    # v5-baseline is a long-lived integration branch that chunk PRs target, so a
    # push to it must be validated like a push to main. Without this, work merged
    # into v5-baseline stays unrun until it reaches main — which is how this
    # branch accumulated 17 CI failures nobody saw: CI had never run it at all.
    #
    # tc-queue/** are the merge queue's candidate branches: TangleClaw makes
    # one by merging a pull request's head into the tip of main, and lands the
    # pull request only if this workflow passes on that commit. No pull request
    # is ever opened for a candidate, so this push trigger is the only thing
    # that tests one. Removing the entry stops every queue landing: each
    # candidate would wait for a check that never starts. The prefix is the
    # one lib/merge-queue-github.js writes under.
    branches: [main, v5-baseline, 'tc-queue/**']
  # release.yml calls this workflow and publishes only if it passes, so the
  # suite runs on the exact commit being released inside the release run
  # itself. Removing this trigger breaks every release: the release workflow
  # references this file and fails to load without it.
  workflow_call:
  # A manual run, from the Actions tab or `gh workflow run Tests --ref <branch>`.
  # GitHub sometimes drops a push webhook, and then a commit on main has no
  # run at all; with only push and pull_request declared, nothing could start
  # one short of pushing another commit. It adds no automatic run. Use it for
  # a commit on main: on a pull request branch the manual run becomes the
  # newest `test` check, which scripts/ci-evidence.js refuses as evidence.
  workflow_dispatch:

# Declared rather than inherited: without this block the token takes the
# repository's default scope, which a settings change could widen with no diff
# here. The suite only reads the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The cache-bump guard asks whether a cache-first public/* asset
          # changed RELATIVE TO the merge base, so both sides have to be in the
          # clone; `merge-base` cannot answer in the default depth-1 checkout.
          # ~16MB and 1,373 commits — a couple of seconds against a minute of
          # suite, which is cheaper than the alternative: a separate job would
          # carry a NEW check name, and `main`'s branch protection requires only
          # `test`, so the guard would report a miss that `gh pr merge --auto`
          # merges straight past.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # node:sqlite requires Node 22+; matches the production runtime
          node-version: 22
      - name: Scan for conflict markers
        # Raw markers were committed into a tracked governance file and merged to
        # main, where they sat across three sessions with no test, gate or wrap
        # step noticing (#882). First step in the job because it is the cheapest
        # question CI can ask and a corrupt tree makes every later answer suspect.
        run: node scripts/conflict-marker-scan.js
      - name: Require a changelog fragment on a code change
        # A push event has no pull request to read; the gate is a pull-request contract.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/changelog-fragment-gate.js --pr "$PR_NUMBER"
      - name: Detect a docs/records/release-metadata-only diff
        # Restricted to pull_request, like the cache-bump guard below: a push
        # event has no base to diff against, and `docs_only` defaults to unset
        # (the Records Gate step below treats that as "run the full suite").
        if: github.event_name == 'pull_request'
        id: docs-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/docs-records-only-diff.js --base "$BASE_SHA"
      - name: Run test suite
        # Two reporters: tap to the log as before, and junit to a file for the
        # audit below. The audit is what turns "CI green" into a statement of
        # what CI actually ran — the runner has no engine CLIs, sits in UTC and
        # is not macOS, so a slice of the suite skips here by design (#844).
        if: steps.docs-scope.outputs.docs_only != 'true'
        run: node --test --test-reporter=tap --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml 'test/*.test.js'
      - name: Run the Records Gate (docs/records/release-metadata diff only)
        # A diff this narrow cannot change what any CODE path does, so the
        # full suite is replaced by what actually certifies a records/release
        # change: the fast local stages, the features-index/changelog/release
        # contract tests, and the index-verify script they depend on. Still
        # writes test-results.xml in the same shape, so the audit and the
        # artifact upload below are unaffected by which branch ran.
        if: steps.docs-scope.outputs.docs_only == 'true'
        run: |
          node scripts/test-stage.js 1
          node scripts/verify-features-index.js --base "$BASE_SHA"
          node --test --test-reporter=tap --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml test/features-index.test.js test/changelog-*.test.js test/release-*.test.js
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Audit what this run did not execute
        # Fails on any skipped test that test/skip-ledger.json does not name,
        # so a new environment-gated test cannot join the not-run set
        # unannounced. Writes "certified N of M" to the step summary.
        run: node scripts/test-skip-audit.js test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results.xml
      - name: Guard the service-worker cache generation
        # A public/* asset served cache-first keeps being served from a browser's
        # existing cache until CACHE_NAME changes, so shipping one without a bump
        # is invisible to an operator who is remote and has no hard-reload. The
        # property is relational — "changed relative to the base" — so only a
        # diff can decide it, which is why this is a workflow step and not a test.
        #
        # In THIS job rather than its own, because the job name is what branch
        # protection requires and `test` is already required: a new name would
        # need an operator to add it before the guard gated anything.
        #
        # `!cancelled()` so a red suite does not hide the verdict — the two
        # answers are independent, and withholding one costs a whole round trip.
        # Restricted to pull_request because a push event has no base to diff
        # against; the guard errors rather than skips on an empty --base, so the
        # condition has to keep it off those runs deliberately.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          # The base as GitHub resolved it, through the environment rather than
          # interpolated into the shell line.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/cache-bump-guard.js --base "$BASE_SHA"


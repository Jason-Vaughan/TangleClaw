name: Tests

on:
  pull_request:
  push:
    # v5-baseline is a long-lived integration branch that chunk PRs target, so a
    # push to it must be validated like a push to main. Without this, work merged
    # into v5-baseline stays unrun until it reaches main — which is how this
    # branch accumulated 17 CI failures nobody saw: CI had never run it at all.
    branches: [main, v5-baseline]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node:sqlite requires Node 22+; matches the production runtime
          node-version: 22
      - name: Run test suite
        # Two reporters: tap to the log as before, and junit to a file for the
        # audit below. The audit is what turns "CI green" into a statement of
        # what CI actually ran — the runner has no engine CLIs, sits in UTC and
        # is not macOS, so a slice of the suite skips here by design (#844).
        run: node --test --test-reporter=tap --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml 'test/*.test.js'
      - name: Audit what this run did not execute
        # Fails on any skipped test that test/skip-ledger.json does not name,
        # so a new environment-gated test cannot join the not-run set
        # unannounced. Writes "certified N of M" to the step summary.
        run: node scripts/test-skip-audit.js test-results.xml

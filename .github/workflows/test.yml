name: Tests

on:
  pull_request:
  push:
    # v5-baseline is a long-lived integration branch that chunk PRs target, so a
    # push to it must be validated like a push to main. Without this, work merged
    # into v5-baseline stays unrun until it reaches main — which is how this
    # branch accumulated 17 CI failures nobody saw: CI had never run it at all.
    branches: [main, v5-baseline]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The cache-bump guard asks whether a cache-first public/* asset
          # changed RELATIVE TO the merge base, so both sides have to be in the
          # clone; `merge-base` cannot answer in the default depth-1 checkout.
          # ~16MB and 1,373 commits — a couple of seconds against a minute of
          # suite, which is cheaper than the alternative: a separate job would
          # carry a NEW check name, and `main`'s branch protection requires only
          # `test`, so the guard would report a miss that `gh pr merge --auto`
          # merges straight past.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # node:sqlite requires Node 22+; matches the production runtime
          node-version: 22
      - name: Scan for conflict markers
        # Raw markers were committed into a tracked governance file and merged to
        # main, where they sat across three sessions with no test, gate or wrap
        # step noticing (#882). First step in the job because it is the cheapest
        # question CI can ask and a corrupt tree makes every later answer suspect.
        run: node scripts/conflict-marker-scan.js
      - name: Run test suite
        # Two reporters: tap to the log as before, and junit to a file for the
        # audit below. The audit is what turns "CI green" into a statement of
        # what CI actually ran — the runner has no engine CLIs, sits in UTC and
        # is not macOS, so a slice of the suite skips here by design (#844).
        run: node --test --test-reporter=tap --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml 'test/*.test.js'
      - name: Audit what this run did not execute
        # Fails on any skipped test that test/skip-ledger.json does not name,
        # so a new environment-gated test cannot join the not-run set
        # unannounced. Writes "certified N of M" to the step summary.
        run: node scripts/test-skip-audit.js test-results.xml
      - name: Guard the service-worker cache generation
        # A public/* asset served cache-first keeps being served from a browser's
        # existing cache until CACHE_NAME changes, so shipping one without a bump
        # is invisible to an operator who is remote and has no hard-reload. The
        # property is relational — "changed relative to the base" — so only a
        # diff can decide it, which is why this is a workflow step and not a test.
        #
        # In THIS job rather than its own, because the job name is what branch
        # protection requires and `test` is already required: a new name would
        # need an operator to add it before the guard gated anything.
        #
        # `!cancelled()` so a red suite does not hide the verdict — the two
        # answers are independent, and withholding one costs a whole round trip.
        # Restricted to pull_request because a push event has no base to diff
        # against; the guard errors rather than skips on an empty --base, so the
        # condition has to keep it off those runs deliberately.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          # The base as GitHub resolved it, through the environment rather than
          # interpolated into the shell line.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/cache-bump-guard.js --base "$BASE_SHA"


name: Release

# Tag and publish a release when a version bump lands on main.
#
# The update path (lib/update-checker.js, lib/update-applier.js) treats the newest
# tag on origin as its only input, so an untagged release reaches no installed
# copy. Tagging used to be manual, and it was skipped for five consecutive
# releases with no signal (#713).
#
# The trigger is deliberately "version.json changed on main", not "a wrap ran".
# The wrap cannot know whether or when its bump reaches main: it returns before
# its own PR merges, that PR is squash-merged (so the wrap commit is replaced),
# its base may be a feature branch, and it may never merge at all. Keying on main
# means every path that lands a bump gets tagged — wrap, cherry-pick, or a hand
# edit — and the tag always points at the commit that actually carries the
# version.
#
# Tag and Release are tracked as two independent conditions, never one "already
# done" flag. A run that pushes the tag and then fails before publishing would
# otherwise be unrecoverable: every re-run would see the tag, report success, and
# publish nothing. A pre-existing tag from any other source — including the
# local-only tags hooks/post-commit creates — is healed the same way.

on:
  push:
    branches: [main]
    paths: ['version.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize releases; two pushes in quick succession must not race on the same tag.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # `push` is already main-only, but workflow_dispatch can be aimed at any ref.
    # Releasing from a feature branch would tag code that is not on main.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Matches the production runtime and the test workflow.
          node-version: 22

      - name: Read the version being released
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./version.json').version")"
          # Bash =~ matches the WHOLE string. `grep -Eq` would not: it is
          # line-oriented and succeeds on any matching line, so a multi-line value
          # would pass on its first line and carry the rest into $GITHUB_OUTPUT.
          # That matters because this value reaches later steps in a
          # contents: write job.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]]; then
            echo "::error::version.json holds an invalid semver version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from $GITHUB_SHA"

      - name: Check what already exists
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through env rather than interpolated into the script body, so
          # the value is data to bash instead of text spliced into the program.
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # Capture ls-remote's exit status explicitly. Inside an `if` condition a
          # failing command substitution is exempt from set -e, so a transient
          # network error would otherwise read as "no tag" and push blindly.
          if ! REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$TAG")"; then
            echo "::error::could not reach origin to check for $TAG."
            exit 1
          fi
          if [ -n "$REMOTE_TAG" ]; then TAG_EXISTS=true; else TAG_EXISTS=false; fi

          # A DRAFT release holds the tag name without publishing anything, and
          # `gh release view` succeeds for drafts. Treating one as "released"
          # would skip publishing and still report green — the same silent hole
          # this workflow exists to close, entered through another door.
          RELEASE_EXISTS=false
          if RELEASE_JSON="$(gh release view "$TAG" --json isDraft 2>/dev/null)"; then
            if [ "$(printf '%s' "$RELEASE_JSON" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).isDraft')" = "true" ]; then
              echo "::error::a DRAFT release already exists for $TAG. Publish or delete it, then re-run."
              exit 1
            fi
            RELEASE_EXISTS=true
          fi

          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_EXISTS release=$RELEASE_EXISTS"

          if [ "$TAG_EXISTS" = true ] && [ "$RELEASE_EXISTS" = true ]; then
            echo "$TAG is already fully released — nothing to do."
          fi

      # Fails the workflow when the version moved but the CHANGELOG section was
      # never promoted. Publishing an empty release would repeat the exact
      # failure this automation exists to prevent: a release that looks complete
      # and delivers nothing.
      - name: Extract release notes from CHANGELOG
        if: steps.existing.outputs.release_exists == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node lib/changelog-notes.js "$VERSION" > release-notes.md
          echo "Release notes ($(wc -l < release-notes.md) lines):"
          cat release-notes.md

      - name: Create and push the tag
        if: steps.existing.outputs.tag_exists == 'false'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated, matching the existing hand-made tags. An annotated tag shows
          # up in ls-remote as both refs/tags/<tag> and a refs/tags/<tag>^{} deref
          # line; parseTagsOutput in lib/update-checker.js reads the former and
          # skips the latter, so either tag style is detected correctly.
          git tag -a "$TAG" -m "TangleClaw $TAG"
          git push origin "$TAG"

      # The whole bug class here is "assumed a step happened". Confirm the tag is
      # visible on origin — which is what update-checker actually polls — rather
      # than trusting the push's exit code. Runs even when the tag pre-existed, so
      # a local-only tag that was never pushed cannot masquerade as delivered.
      - name: Verify the tag is visible on origin
        if: steps.existing.outputs.release_exists == 'false'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$TAG")"; then
            echo "::error::could not reach origin to verify $TAG."
            exit 1
          fi
          if [ -z "$REMOTE_TAG" ]; then
            echo "::error::$TAG is not visible on origin — installs would not see this release."
            exit 1
          fi
          echo "$TAG confirmed on origin."

      - name: Publish the GitHub Release
        if: steps.existing.outputs.release_exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          echo "Published $TAG"

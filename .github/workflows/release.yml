name: Release

# Tag and publish a release when a version bump lands on main.
#
# The update path (lib/update-checker.js, lib/update-applier.js) treats the newest
# tag on origin as its only input, so an untagged release reaches no installed
# copy. Tagging used to be manual, and it was skipped for five consecutive
# releases with no signal (#713).
#
# The trigger is deliberately "version.json changed on main", not "a wrap ran".
# The wrap cannot know whether or when its bump reaches main: it returns before
# its own PR merges, that PR is squash-merged (so the wrap commit is replaced),
# its base may be a feature branch, and it may never merge at all. Keying on main
# means every path that lands a bump gets tagged — wrap, cherry-pick, or a hand
# edit — and the tag always points at the commit that actually carries the
# version.
#
# Tag and Release are tracked as two independent conditions, never one "already
# done" flag. A run that pushes the tag and then fails before publishing would
# otherwise be unrecoverable: every re-run would see the tag, report success, and
# publish nothing. A pre-existing tag from any other source — including the
# local-only tags hooks/post-commit creates — is healed the same way.
#
# A release publishes only the exact commit that was tested (#1551). Two rules
# bind the tag, the tests and the Release to GITHUB_SHA:
#   - The `test` job runs the suite (test.yml, called as a reusable workflow)
#     on GITHUB_SHA inside THIS run, and the publishing job needs it. Tested and
#     released are the same commit by construction; nothing looks up another
#     run's result, so there is nothing to wait on and nothing to spoof.
#   - The tag must dereference to GITHUB_SHA: before an existing tag is healed,
#     and on origin after a push. A tag naming any other commit refuses the run.
#     This workflow never moves or deletes a tag; a mismatch is for a human.

on:
  push:
    branches: [main]
    paths: ['version.json']
  workflow_dispatch:

# Read-only by default. Only the publishing job below is granted contents:
# write, so the suite, which runs inside this workflow too, never holds it.
permissions:
  contents: read

concurrency:
  # Serialize releases; two pushes in quick succession must not race on the same tag.
  group: release
  cancel-in-progress: false

jobs:
  test:
    # `push` is already main-only, but workflow_dispatch can be aimed at any ref.
    # Releasing from a feature branch would tag code that is not on main.
    if: github.ref == 'refs/heads/main'
    # A called workflow's github context is this run's, so the suite checks out
    # and tests GITHUB_SHA. Its token can only be narrowed from this grant.
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  release:
    # No status function in `if:`, so this job is skipped unless `test`
    # succeeded. Adding always() or !cancelled() here would publish untested code.
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The tag is created from the checkout's HEAD, so HEAD has to be the commit
      # the `test` job tested.
      - name: Confirm the checkout is the tested commit
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::checkout is $HEAD_SHA, not $GITHUB_SHA, the commit this run tested."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22 matches the production runtime and the test workflow. The
          # exact patch is pinned here, and only here, because setup-node
          # resolves a bare `22` to whatever is newest when the job starts, and
          # this job holds contents: write. This removes run-time version
          # selection only: setup-node still downloads that release with no
          # digest pinned in this file (#1827). Bump it by hand; nothing
          # updates it.
          node-version: 22.23.3

      - name: Read the version being released
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./version.json').version")"
          # Bash =~ matches the WHOLE string. `grep -Eq` would not: it is
          # line-oriented and succeeds on any matching line, so a multi-line value
          # would pass on its first line and carry the rest into $GITHUB_OUTPUT.
          # That matters because this value reaches later steps in a
          # contents: write job.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]]; then
            echo "::error::version.json holds an invalid semver version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from $GITHUB_SHA"

      - name: Check what already exists
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through env rather than interpolated into the script body, so
          # the value is data to bash instead of text spliced into the program.
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # Capture ls-remote's exit status explicitly. Inside an `if` condition a
          # failing command substitution is exempt from set -e, so a transient
          # network error would otherwise read as "no tag" and push blindly.
          #
          # The second pattern is required: ls-remote filters by pattern, and
          # without it an annotated tag's peeled `^{}` line (the commit) is left
          # out, so only the tag object's SHA would reach the gate below.
          if ! REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"; then
            echo "::error::could not reach origin to check for $TAG."
            exit 1
          fi
          if [ -n "$REMOTE_TAG" ]; then TAG_EXISTS=true; else TAG_EXISTS=false; fi

          # A DRAFT release holds the tag name without publishing anything, and
          # `gh release view` succeeds for drafts. Treating one as "released"
          # would skip publishing and still report green — the same silent hole
          # this workflow exists to close, entered through another door.
          RELEASE_EXISTS=false
          if RELEASE_JSON="$(gh release view "$TAG" --json isDraft 2>/dev/null)"; then
            if [ "$(printf '%s' "$RELEASE_JSON" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).isDraft')" = "true" ]; then
              echo "::error::a DRAFT release already exists for $TAG. Publish or delete it, then re-run."
              exit 1
            fi
            RELEASE_EXISTS=true
          fi

          # An existing tag must already name the tested commit, whether or not
          # its Release exists. Healing a missing Release onto a tag that names
          # another commit would publish code this run never tested. And a tag
          # plus Release on a different commit means this commit carries a
          # version that was already released from somewhere else, which
          # "already done" would silently bless. Both refuse red.
          if [ "$TAG_EXISTS" = true ]; then
            printf '%s\n' "$REMOTE_TAG" \
              | node scripts/release-tag-gate.js --tag "$TAG" --expect "$GITHUB_SHA"
          fi

          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_EXISTS release=$RELEASE_EXISTS"

          if [ "$TAG_EXISTS" = true ] && [ "$RELEASE_EXISTS" = true ]; then
            echo "$TAG is already fully released — nothing to do."
          fi

      # Fails the workflow when the version moved but the CHANGELOG section was
      # never promoted. Publishing an empty release would repeat the exact
      # failure this automation exists to prevent: a release that looks complete
      # and delivers nothing.
      - name: Extract release notes from CHANGELOG
        if: steps.existing.outputs.release_exists == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node lib/changelog-notes.js "$VERSION" > release-notes.md
          echo "Release notes ($(wc -l < release-notes.md) lines):"
          cat release-notes.md

      - name: Create and push the tag
        if: steps.existing.outputs.tag_exists == 'false'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated, matching the existing hand-made tags. An annotated tag shows
          # up in ls-remote as both refs/tags/<tag> and a refs/tags/<tag>^{} deref
          # line; parseTagsOutput in lib/update-checker.js reads the former and
          # skips the latter, so either tag style is detected correctly.
          git tag -a "$TAG" -m "TangleClaw $TAG"
          git push origin "$TAG"

      # The whole bug class here is "assumed a step happened". Confirm the tag is
      # on origin — which is what update-checker actually polls — and that it
      # dereferences to the tested commit, rather than trusting the push's exit
      # code. Runs even when the tag pre-existed, so a local-only tag that was
      # never pushed cannot masquerade as delivered.
      - name: Verify the tag on origin names the tested commit
        if: steps.existing.outputs.release_exists == 'false'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Both patterns, for the same reason as the existence check above.
          if ! REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"; then
            echo "::error::could not reach origin to verify $TAG."
            exit 1
          fi
          # Absent and mismatched both refuse here; no --allow-absent.
          printf '%s\n' "$REMOTE_TAG" \
            | node scripts/release-tag-gate.js --tag "$TAG" --expect "$GITHUB_SHA"

      - name: Publish the GitHub Release
        if: steps.existing.outputs.release_exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          echo "Published $TAG"

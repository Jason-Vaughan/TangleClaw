<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TangleClaw Platform Screenshots</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 3rem;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            color: #fff;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background-color: #111;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }
        .card h3 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: #a1a1aa;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>TangleClaw Platform Integration & Capabilities</h1>
    
    <div class="gallery">
        <div class="card">
            <h3>Dashboard</h3>
            <img src="screenshots/Dashboard.png" alt="Dashboard">
        </div>
        <div class="card">
            <h3>Project Rules & Guidelines</h3>
            <img src="screenshots/Project Rules 2.png" alt="Project Rules">
        </div>
        <div class="card">
            <h3>Eval Audit</h3>
            <img src="screenshots/eval audit.png" alt="Eval Audit">
        </div>
        <div class="card">
            <h3>Global Settings</h3>
            <img src="screenshots/global settings.png" alt="Global Settings">
        </div>
        <div class="card">
            <h3>Master Session Architecture</h3>
            <img src="screenshots/master session.png" alt="Master Session">
        </div>
        <div class="card">
            <h3>OpenClaw Integration</h3>
            <img src="screenshots/open claw integration.png" alt="OpenClaw Integration">
        </div>
        <div class="card">
            <h3>OpenClaw Services</h3>
            <img src="screenshots/open claw list.png" alt="OpenClaw List">
        </div>
        <div class="card">
            <h3>Project Config Details</h3>
            <img src="screenshots/project settings 1.png" alt="Project Settings">
        </div>
        <div class="card">
            <h3>Startup & Wrap Protocols</h3>
            <img src="screenshots/project settings 2 - startup and wrap rules.png" alt="Startup Rules">
        </div>
        <div class="card">
            <h3>Session History Analysis</h3>
            <img src="screenshots/session history detail.png" alt="Session History">
        </div>
        <div class="card">
            <h3>Session Archives</h3>
            <img src="screenshots/session history summary list.png" alt="Session Summary">
        </div>
    </div>

</body>
</html>

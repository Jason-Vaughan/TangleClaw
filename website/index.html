<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TangleClaw | AI-Native SDLC Orchestration</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
            background: linear-gradient(180deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.tagline {
            font-size: 1.5rem;
            color: #a1a1aa;
            max-width: 600px;
            margin-bottom: 3rem;
            line-height: 1.4;
        }
        .btn {
            background-color: #fff;
            color: #000;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s ease;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .features {
            margin-top: 5rem;
            display: flex;
            gap: 2rem;
            color: #71717a;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .features span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .features span::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 4px;
            background-color: #52525b;
            border-radius: 50%;
        }
        .features span:first-child::before {
            display: none;
        }
    </style>
</head>
<body>

    <h1>TangleClaw</h1>
    <p class="tagline">An open-source, local-first AI-native SDLC orchestration platform.</p>
    
    <a href="https://github.com/Jason-Vaughan/TangleClaw" class="btn">View on GitHub</a>

    <div class="features">
        <span>Persistent Sessions</span>
        <span>Fleet Orchestration</span>
        <span>Agent Switchboard</span>
        <span>Local-First</span>
    </div>

</body>
</html>

# Default-deny network profile for the soak guest (#2020).
#
# Loaded by guest-setup.sh with the host's address as a macro:
#   pfctl -D host_addr=<addr> -f soak-deny.conf -E
#
# Loopback is unfiltered: the guest's TangleClaw, ttyd and the soak driver
# talk to each other there. The one other thing allowed is SSH in from the
# host, and pf's state lets only that session's replies back out. Nothing else
# in, nothing out: no DNS, no package fetches, no route to production.

set block-policy drop
set skip on lo0
block drop all
pass in quick inet proto tcp from $host_addr to any port 22 flags S/SA keep state

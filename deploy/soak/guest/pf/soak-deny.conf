# Default-deny network profile for the soak guest (#2020).
#
# Loaded by guest-setup.sh, which validates every macro first:
#   pfctl -D host_addr=<IPv4> -D dhcp_server=<IPv4> -D guest_if=<interface> -f soak-deny.conf -E
#
# Loopback is unfiltered: the guest's TangleClaw, ttyd and the soak driver
# talk to each other there. Beyond it, only two things are allowed, both on
# the guest's own interface:
#   - SSH in from the host's address, the operator's management path. pf
#     state lets that session's replies out; the guest cannot open a
#     connection.
#   - DHCP, client port 68 to server port 67 only, so the guest keeps its
#     address (and the management path) for a 72-hour run: broadcast for
#     DISCOVER, REQUEST and REBIND, unicast only to the attested DHCP server
#     for RENEW, and in only from that server. The DHCP server is identified
#     on its own, from the lease; it is not assumed to be the SSH host.
# Nothing else in, nothing out: no DNS, no IPv6, no route to production.

set block-policy drop
set skip on lo0
block drop all
pass in quick on $guest_if inet proto tcp from $host_addr to ($guest_if) port 22 flags S/SA keep state
pass out quick on $guest_if inet proto udp from any port 68 to 255.255.255.255 port 67 keep state
pass out quick on $guest_if inet proto udp from any port 68 to $dhcp_server port 67 keep state
pass in quick on $guest_if inet proto udp from $dhcp_server port 67 to any port 68 keep state

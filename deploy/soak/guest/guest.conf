# Soak guest settings (#2020). Sourced by host-provision.sh and guest-setup.sh.
#
# Every value can be overridden from the environment, so a run's settings are
# whatever was exported plus these defaults. Record the exported values with the
# run's evidence.
#
# No secrets belong here: the guest holds no production credentials, and the
# guest's own TangleClaw service token (if its gate is on) is passed in the
# environment of the one command that needs it, never written to a file.
#
# The base image and the tart flags are operator-checked settings: confirm them
# against the installed tart (`tart --version`, `tart run --help`) before the
# first provisioning run.

# --- Host side (host-provision.sh) ---
: "${SOAK_VM_NAME:=tc-soak-guest}"
: "${SOAK_BASE_IMAGE:=ghcr.io/cirruslabs/macos-sequoia-base:latest}"
: "${SOAK_CPU:=4}"
: "${SOAK_MEMORY_MB:=8192}"
: "${SOAK_DISK_GB:=80}"
# A dedicated host directory shared into the guest (inputs in, evidence out).
# It is the only host path the guest can see, so never point it at $HOME or /.
: "${SOAK_SHARE_DIR:=$HOME/tc-soak-share}"
# Mounted in a macOS guest at "/Volumes/My Shared Files/<tag>".
: "${SOAK_SHARE_TAG:=soak}"

# --- Guest side (guest-setup.sh) ---
# The host's address on the VM network, and the guest interface facing it. pf
# allows SSH in from this address, on this interface only.
: "${SOAK_HOST_ADDR:=192.168.64.1}"
: "${SOAK_GUEST_IF:=en0}"
# The DHCP server pf lets the guest renew with. Empty means: take it from the
# guest's current lease (ipconfig getpacket), which the admin attestation
# records. It is never assumed to be SOAK_HOST_ADDR.
: "${SOAK_DHCP_SERVER:=}"
# The dedicated user the soak workload runs as: not an admin, no sudo, no pf.
# guest-setup.sh creates it with a random password nobody keeps.
: "${SOAK_WORKLOAD_USER:=soakrun}"
# Every probe is killed after this many seconds; a probe that hangs is a
# failure, never a pass.
: "${SOAK_PROBE_TIMEOUT:=10}"
# Outside addresses guest-setup.sh must fail to reach once pf is loaded. They
# are literals, so the check never depends on DNS: TCP to an IPv4 and an IPv6
# address, and a DNS query over UDP sent straight to a resolver's address.
: "${SOAK_EGRESS_PROBE_ADDR:=1.1.1.1}"
: "${SOAK_EGRESS_PROBE_ADDR6:=2606:4700:4700::1111}"
: "${SOAK_DNS_PROBE_ADDR:=1.1.1.1}"
# The guest TangleClaw's projectsDir; the synthetic repos are created here, as
# the workload user.
: "${SOAK_PROJECTS_ROOT:=/Users/$SOAK_WORKLOAD_USER/Projects}"
# Local bare origins for the synthetic repos. Never a network remote.
: "${SOAK_ORIGINS_ROOT:=/Users/$SOAK_WORKLOAD_USER/soak-origins}"
# The synthetic projects (must match the schedule's --projects).
: "${SOAK_PROJECTS:=soak-a,soak-b,soak-c}"
# The guest TangleClaw, on loopback.
: "${SOAK_TC_PORT:=3102}"
# Where the stub engine goes on PATH.
: "${SOAK_BIN_DIR:=/usr/local/bin}"

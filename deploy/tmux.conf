# TangleClaw tmux configuration
# Optimized for remote access via ttyd on iPhone
# Canonical source — copied to ~/.tmux.conf by deploy/install.sh

# Increase scrollback buffer
set -g history-limit 50000

# Enable mouse support (critical for touch interaction)
set -g mouse on

# No MouseDragEnd1Pane override on purpose (#438). An earlier binding piped
# every copy-mode drag into ~/.tangleclaw/clipboard for a "browser Copy button"
# that never read it. tmux's default for that key, copy-selection-and-cancel,
# sets a tmux buffer — and the session page's Copy button reads the newest
# buffer via `tmux show-buffer`, so the default is the one that actually works.

# 256 color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Disable alternate screen so xterm.js scrollback works on mobile touch
# Without this, tmux uses alt screen (zero scrollback) and touch scroll can't reach history
set -ga terminal-overrides ",xterm*:smcup@:rmcup@"

# Status bar — lime green palette (matches TangleClaw v2)
set -g status-style "bg=#1A1A1A,fg=#E8E8E8"
# Carries no version on purpose: a static file cannot know which version the
# server process loaded, and a stale number here would be worse than none. The
# server overwrites this per session with "TangleClaw v<version>" (lib/tmux.js
# buildStatusLeft), so this value only shows on a session tmux started without
# TangleClaw.
set -g status-left "#[fg=#8BC34A,bold] TangleClaw "
set -g status-right "#[fg=#777777] %H:%M  %Y-%m-%d "
set -g status-left-length 30
set -g status-right-length 30

# Window status — hidden (single-window sessions; window names can be noisy
# because shells/tools rewrite them, e.g. Claude Code sets it to its version)
set -g window-status-format ""
set -g window-status-current-format ""

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#8BC34A"

# Don't rename windows automatically
set -g allow-rename off

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Reduce escape time (faster key response)
set -sg escape-time 10

# Focus events (useful for some terminal apps)
set -g focus-events on

# Generated from test/tiers.json by `node scripts/test-tiers.js --testament`; do not edit
# by hand. `node scripts/test-tiers.js --check` refuses this file when it differs from what
# that command writes. What it declares and how the pool is set up: docs/test-pyramid.md.
#
# Container executor (#2733): the pool builds .devcontainer/Dockerfile, which gives every
# tier tmux, git and the other CLIs the Large tier drives. No setup steps: the suite has no
# dependencies to install. Each suite runs one file per process because node's junit report
# before Node 24 does not say which file a test was in.
manifest_version = 3
name = "tangleclaw"
executor = "container"
env_inputs = [".devcontainer/Dockerfile", ".node-version"]
batch_timeout_s = 1800

[image]
dockerfile = ".devcontainer/Dockerfile"
inputs = [".devcontainer/Dockerfile"]

[setup]
steps = []

